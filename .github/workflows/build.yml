name: upload pdfs to yandex disk

on:
  push:
    branches:
      - pdf_loader

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Collect pdf files
        id: files
        run: |
          set -e
          FILES=$(find pdf -type f -name "*.pdf" | sed 's|^pdf/||')
          echo "Found files:"
          printf "%s\n" "$FILES"
          {
            echo "files<<EOF"
            printf "%s\n" "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Yandex Disk
        run: |
          set -euo pipefail

          TOKEN="${{ secrets.YANDEX_OAUTH_TOKEN }}"
          API="https://cloud-api.yandex.net/v1/disk/resources"

          while read -r FILE; do
            [ -z "$FILE" ] && continue

            TYPE=$(echo "$FILE" | cut -d/ -f1)
            SEM=$(echo "$FILE" | cut -d/ -f2)
            SUBJECT=$(echo "$FILE" | cut -d/ -f3)
            NAME=$(basename "$FILE" .pdf)

            case "$TYPE" in
              l) TYPE="Lectures" ;;
              s) TYPE="Seminars" ;;
              e) TYPE="Exams" ;;
              *) TYPE="Other" ;;
            esac

            SEM="${SEM}_Semester"

            REMOTE_DIR="Lectures Tex Club/${TYPE}/${SEM}/${SUBJECT}"
            REMOTE_FILE="${REMOTE_DIR}/${NAME}.pdf"

            echo "Uploading $FILE -> $REMOTE_FILE"

            # создать каталог (если уже есть — API вернёт 409, это нормально)
            curl -sS -X PUT \
              --get \
              --data-urlencode "path=${REMOTE_DIR}" \
              --header "Authorization: ${TOKEN}" \
              "${API}" \
              -o /dev/null -w "mkdir status: %{http_code}\n"

            # получить upload URL
            RESP=$(curl -sS --get \
              --data-urlencode "path=${REMOTE_FILE}" \
              --data-urlencode "overwrite=true" \
              --header "Authorization: ${TOKEN}" \
              "${API}/upload")

            echo "upload API response: $RESP"

            URL=$(echo "$RESP" | jq -r '.href')

            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "Failed to get upload URL for $FILE"
              exit 1
            fi

            # загрузить файл
            curl -sS -X PUT \
              --data-binary "@pdf/$FILE" \
              --header "Authorization: ${TOKEN}" \
              "$URL"

            echo "Uploaded $FILE"

          done <<< "${{ steps.files.outputs.files }}"