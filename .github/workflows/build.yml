name: upload pdfs to yandex disk

on:
  push:
    branches:
      - pdf_loader

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Find pdf files
        id: files
        run: |
          FILES=$(find pdf -name "*.pdf" | sed 's|^pdf/||')
          printf "%s\n" "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload to Yandex Disk
        run: |
          while read FILE; do

            TYPE=$(echo $FILE | cut -d/ -f1)
            SEM=$(echo $FILE | cut -d/ -f2)
            SUBJECT=$(echo $FILE | cut -d/ -f3)
            NAME=$(basename "$FILE" .pdf)

            case $TYPE in
              l) TYPE="Lectures" ;;
              s) TYPE="Seminars" ;;
              e) TYPE="Exams" ;;
              *) TYPE="Other" ;;
            esac

            SEM="${SEM}_Semester"

            REMOTE_DIR="Lectures Tex Club/${TYPE}/${SEM}/${SUBJECT}"
            REMOTE_FILE="${REMOTE_DIR}/${NAME}.pdf"

            echo "Uploading $FILE -> $REMOTE_FILE"

            # создать каталог (если существует — ничего страшного)
            curl -s -X PUT \
              --data-urlencode "path=$REMOTE_DIR" \
              --header "Authorization: ${{ secrets.YANDEX_OAUTH_TOKEN }}" \
              https://cloud-api.yandex.net/v1/disk/resources > /dev/null

            # получить upload URL
            URL=$(curl -s --get \
              --data-urlencode "path=$REMOTE_FILE" \
              --data-urlencode "overwrite=true" \
              --header "Authorization: ${{ secrets.YANDEX_OAUTH_TOKEN }}" \
              https://cloud-api.yandex.net/v1/disk/resources/upload \
              | jq -r '.href')

            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "Failed to get upload URL for $FILE"
              exit 1
            fi

            # загрузить файл
            curl -s -X PUT \
              --data-binary "@pdf/$FILE" \
              --header "Authorization: ${{ secrets.YANDEX_OAUTH_TOKEN }}" \
              "$URL"

          done <<< "${{ steps.files.outputs.files }}"