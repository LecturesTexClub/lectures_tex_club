name: build and upload latex

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v2
  
      - name: Get targets
        id: get-targets
        run: |
          export BRANCH=${GITHUB_REF#refs/heads/}
          python -c '
          import json
          import os
          targets = json.load(open("config.json", "r"))[os.environ["BRANCH"]]
          print("::set-output name=matrix::[", ", ".join(repr(t) for t in targets if not t.startswith("!")), "]", sep="")
          '

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v2
      
      - name: Configure build
        id: configure-build
        run: |
          pwd
          mkdir build
          BRANCH_NAME=${{ matrix.course }}
          echo "BRANCH_NAME=$(echo ${BRANCH_NAME})" >> $GITHUB_ENV
          BRANCH_ARGUMENTS=(${BRANCH_NAME//\// })
          
          TYPE=${BRANCH_ARGUMENTS[0]}
          SEMESTER=${BRANCH_ARGUMENTS[1]}
          SUBJECT_NAME=${BRANCH_ARGUMENTS[2]}
          CONSPECT_NAME=${BRANCH_ARGUMENTS[3]}
          
          case ${TYPE} in
            l)
              TYPE="Lectures"
              ;;
            s)
              TYPE="Seminars"
              ;;
            e)
              TYPE="Exams"
              ;;
            *)
              TYPE="Other"
              ;;
          esac
          SEMESTER="${SEMESTER}_Semester"

          FULL_PATH="${TYPE}/${SEMESTER}/${SUBJECT_NAME}/${CONSPECT_NAME}"
          echo "FULL_PATH=$(echo ${FULL_PATH})" >> ${GITHUB_ENV}

      - name: Build
        id: build
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex
          working_directory: ${{ env.FULL_PATH }}
          args: -output-dir=../../../../build
          compiler: xelatex
          post_compile: "xelatex -output-dir=${GITHUB_WORKSPACE}/build main.tex"

      - name: Upload
        shell: bash
        run: |
          set -euo pipefail
      
          TOKEN='${{ secrets.YANDEX_OAUTH_TOKEN }}'
          DEST='Lectures Tex Club/${{ env.FULL_PATH }}.pdf'
      
          # Создаём родительские директории, если их ещё нет.
          DIR=$(dirname "$DEST")
          CURRENT=""
      
          IFS='/' read -ra PARTS <<< "$DIR"
      
          for PART in "${PARTS[@]}"; do
            if [[ -z "$CURRENT" ]]; then
              CURRENT="$PART"
            else
              CURRENT="$CURRENT/$PART"
            fi
          
            HTTP_CODE=$(curl --silent --show-error \
              --output /tmp/yadisk-mkdir-response \
              --write-out '%{http_code}' \
              --request PUT \
              --get \
              --data-urlencode "path=$CURRENT" \
              --header "Authorization: OAuth $TOKEN" \
              'https://cloud-api.yandex.net/v1/disk/resources')
          
            if [[ "$HTTP_CODE" != "201" && "$HTTP_CODE" != "409" ]]; then
              echo "Failed to create directory: $CURRENT"
              cat /tmp/yadisk-mkdir-response
              exit 1
            fi
          done
      
          RESPONSE_FILE=$(mktemp)
      
          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --get \
            --data-urlencode "path=$DEST" \
            --data-urlencode 'overwrite=true' \
            --header "Authorization: OAuth $TOKEN" \
            'https://cloud-api.yandex.net/v1/disk/resources/upload')
      
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "Failed to get upload URL:"
            cat "$RESPONSE_FILE"
            exit 1
          fi
      
          URL=$(jq -er '.href' "$RESPONSE_FILE")
      
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --data-binary '@build/main.pdf' \
            "$URL"
