name: Upload PDFs to Yandex Disk

on:
  push:
    branches:
      - pdf_loader

  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup wrong folders
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          API="https://cloud-api.yandex.net/v1/disk/resources"

          # Старый ошибочный каталог.
          # Ошибку здесь игнорируем: каталога может уже не быть.
          curl -sS \
            -X DELETE \
            --get \
            --data-urlencode "path=Lectures Tex Club/Lectures/2_Semester/Calsulus" \
            --data-urlencode "permanently=true" \
            --header "Authorization: OAuth ${YANDEX_TOKEN}" \
            "${API}" \
            >/dev/null || true

      - name: Upload PDFs to Yandex Disk
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          API="https://cloud-api.yandex.net/v1/disk/resources"

          # ============================================================
          # mkdir -p для Yandex Disk
          #
          # Yandex Disk API не создаёт промежуточные директории
          # автоматически, поэтому:
          #
          #   A/B/C
          #
          # создаём последовательно:
          #
          #   A
          #   A/B
          #   A/B/C
          #
          # HTTP 201:
          #   каталог создан
          #
          # HTTP 409 +
          # DiskPathPointsToExistentDirectoryError:
          #   каталог уже существует
          #
          # Любой другой ответ считаем ошибкой.
          # ============================================================

          mkdir_recursive() {
            local path="$1"
            local current=""
            local part
            local body
            local status
            local error

            IFS='/' read -ra parts <<< "$path"

            for part in "${parts[@]}"; do
              [[ -z "$part" ]] && continue

              if [[ -z "$current" ]]; then
                current="$part"
              else
                current="${current}/${part}"
              fi

              body="$(mktemp)"

              status="$(
                curl -sS \
                  -o "$body" \
                  -w '%{http_code}' \
                  -X PUT \
                  --get \
                  --data-urlencode "path=${current}" \
                  --header "Authorization: OAuth ${YANDEX_TOKEN}" \
                  "${API}"
              )"

              case "$status" in
                201)
                  echo "Created directory: ${current}"
                  ;;

                409)
                  error="$(jq -r '.error // empty' "$body")"

                  if [[ "$error" == "DiskPathPointsToExistentDirectoryError" ]]; then
                    echo "Directory exists: ${current}"
                  else
                    echo
                    echo "ERROR: Yandex Disk returned HTTP 409"
                    echo "while creating directory:"
                    echo "  ${current}"
                    echo
                    echo "Error code:"
                    echo "  ${error}"
                    echo
                    echo "Response:"
                    cat "$body"
                    echo

                    rm -f "$body"
                    exit 1
                  fi
                  ;;

                *)
                  echo
                  echo "ERROR: failed to create directory:"
                  echo "  ${current}"
                  echo
                  echo "HTTP status:"
                  echo "  ${status}"
                  echo
                  echo "Response:"
                  cat "$body"
                  echo

                  rm -f "$body"
                  exit 1
                  ;;
              esac

              rm -f "$body"
            done
          }

          # ============================================================
          # Загрузка одного файла.
          # ============================================================

          upload_file() {
            local local_file="$1"
            local remote_file="$2"

            local response
            local upload_url
            local body
            local status

            # Получаем временный upload URL.
            response="$(
              curl -sS \
                --get \
                --data-urlencode "path=${remote_file}" \
                --data-urlencode "overwrite=true" \
                --header "Authorization: OAuth ${YANDEX_TOKEN}" \
                "${API}/upload"
            )"

            upload_url="$(jq -r '.href // empty' <<< "$response")"

            if [[ -z "$upload_url" ]]; then
              echo
              echo "ERROR: failed to get upload URL"
              echo
              echo "Local:"
              echo "  ${local_file}"
              echo
              echo "Remote:"
              echo "  ${remote_file}"
              echo
              echo "Yandex Disk response:"
              echo "${response}"
              echo

              exit 1
            fi

            body="$(mktemp)"

            # upload_url уже содержит авторизацию, поэтому OAuth-header
            # при PUT сюда не нужен.
            status="$(
              curl -sS \
                -o "$body" \
                -w '%{http_code}' \
                -X PUT \
                --data-binary "@${local_file}" \
                "${upload_url}"
            )"

            case "$status" in
              2??)
                ;;
              *)
                echo
                echo "ERROR: failed to upload file"
                echo
                echo "Local:"
                echo "  ${local_file}"
                echo
                echo "Remote:"
                echo "  ${remote_file}"
                echo
                echo "HTTP status:"
                echo "  ${status}"
                echo
                echo "Response:"
                cat "$body"
                echo

                rm -f "$body"
                exit 1
                ;;
            esac

            rm -f "$body"
          }

          # ============================================================
          # Проверяем структуру pdf/.
          #
          # Поддерживаются ровно:
          #
          #   pdf/l/<semester>/<subject>/<file>.pdf
          #   pdf/s/<semester>/<subject>/<file>.pdf
          #   pdf/e/<semester>/<subject>/<file>.pdf
          #
          # Например:
          #
          #   pdf/l/6/Functional_Analysis/2026_Konstantinov.pdf
          #   pdf/s/4/Harmonic_Analysis/2026_Malikov.pdf
          #   pdf/e/4/Probability_Theory/2025_Shabanov.pdf
          #
          # В Yandex Disk:
          #
          #   l -> Lectures
          #   s -> Seminars
          #   e -> Exams
          #
          # Получаем:
          #
          # Lectures Tex Club/
          #   Lectures/
          #     6_Semester/
          #       Functional_Analysis/
          #
          #   Seminars/
          #     4_Semester/
          #       Harmonic_Analysis/
          #
          #   Exams/
          #     4_Semester/
          #       Probability_Theory/
          # ============================================================

          if [[ ! -d pdf ]]; then
            echo "ERROR: directory 'pdf' does not exist"
            exit 1
          fi

          mapfile -t files < <(
            find pdf \
              -type f \
              -name '*.pdf' \
              -print \
              | sed 's|^pdf/||' \
              | sort
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No PDF files found."
            exit 0
          fi

          echo "Found ${#files[@]} PDF files:"
          printf '  %s\n' "${files[@]}"

          uploaded=0

          for file in "${files[@]}"; do
            [[ -z "$file" ]] && continue

            local_file="pdf/${file}"

            # ----------------------------------------------------------
            # Ожидаем:
            #
            # kind / semester / subject / filename
            # ----------------------------------------------------------

            kind=""
            semester=""
            subject=""
            filename=""
            extra=""

            IFS='/' read -r \
              kind \
              semester \
              subject \
              filename \
              extra \
              <<< "$file"

            if [[ -z "$kind" || \
                  -z "$semester" || \
                  -z "$subject" || \
                  -z "$filename" ]]; then

              echo
              echo "ERROR: invalid PDF path:"
              echo "  ${file}"
              echo
              echo "Expected:"
              echo "  <l|s|e>/<semester>/<subject>/<file>.pdf"
              exit 1
            fi

            if [[ -n "$extra" ]]; then
              echo
              echo "ERROR: unexpected directory nesting:"
              echo "  ${file}"
              echo
              echo "Expected exactly:"
              echo "  <l|s|e>/<semester>/<subject>/<file>.pdf"
              exit 1
            fi

            if [[ "$filename" != *.pdf ]]; then
              echo
              echo "ERROR: file does not end in .pdf:"
              echo "  ${file}"
              exit 1
            fi

            if [[ ! "$semester" =~ ^[0-9]+$ ]]; then
              echo
              echo "ERROR: semester must be numeric:"
              echo "  ${file}"
              echo
              echo "Parsed semester:"
              echo "  ${semester}"
              exit 1
            fi

            case "$kind" in
              l)
                type="Lectures"
                ;;

              s)
                type="Seminars"
                ;;

              e)
                type="Exams"
                ;;

              *)
                echo
                echo "ERROR: unknown PDF type:"
                echo "  ${kind}"
                echo
                echo "File:"
                echo "  ${file}"
                echo
                echo "Allowed:"
                echo "  l = Lectures"
                echo "  s = Seminars"
                echo "  e = Exams"
                exit 1
                ;;
            esac

            remote_dir="Lectures Tex Club/${type}/${semester}_Semester/${subject}"
            remote_file="${remote_dir}/${filename}"

            echo
            echo "============================================================"
            echo "Uploading"
            echo "============================================================"
            echo
            echo "Local:"
            echo "  ${local_file}"
            echo
            echo "Remote:"
            echo "  ${remote_file}"
            echo

            mkdir_recursive "$remote_dir"

            upload_file \
              "$local_file" \
              "$remote_file"

            uploaded=$((uploaded + 1))

            echo
            echo "Uploaded successfully:"
            echo "  ${file}"
          done

          echo
          echo "============================================================"
          echo "Upload completed"
          echo "============================================================"
          echo
          echo "Uploaded files: ${uploaded}"
